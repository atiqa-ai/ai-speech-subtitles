name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The modules under test need only the OpenAI SDK. Installing torch and
      # Whisper here would add minutes per job for no coverage, so the test
      # requirements are deliberately separate from requirements.txt.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      # Nothing in the suite may contact the network or need an API key.
      - name: Confirm the suite passes with no API key set
        run: python -m pytest tests/ -q
        env:
          OPENAI_API_KEY: ""

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-speech-subtitles:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exercises the whole import graph, including Whisper and torch. If a
      # dependency were missing from requirements.txt, this is what catches it.
      - name: Entry point responds
        run: docker run --rm ai-speech-subtitles:ci --help

      # Proves the container's dependency set is sufficient for the modules the
      # tests import, instead of assuming the host build is representative.
      # --entrypoint is required because the image entrypoint is `python main.py`.
      - name: Run the test suite inside the image
        run: |
          docker run --rm -e OPENAI_API_KEY="" --entrypoint sh \
            ai-speech-subtitles:ci \
            -c "pip install -q -r requirements-dev.txt && python -m pytest tests/ -q"

      - name: Report image size
        run: docker images ai-speech-subtitles:ci --format "{{.Size}}"
